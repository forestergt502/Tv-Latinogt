name: Actualizar TV Latino

"on":
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y generar TV Latino
        shell: python
        run: |
          import urllib.request
          import re

          # Listas públicas de IPTV-org por países
          PLAYLISTS = [
              "https://iptv-org.github.io/iptv/countries/ar.m3u",
              "https://iptv-org.github.io/iptv/countries/bo.m3u",
              "https://iptv-org.github.io/iptv/countries/cl.m3u",
              "https://iptv-org.github.io/iptv/countries/co.m3u",
              "https://iptv-org.github.io/iptv/countries/cr.m3u",
              "https://iptv-org.github.io/iptv/countries/do.m3u",
              "https://iptv-org.github.io/iptv/countries/ec.m3u",
              "https://iptv-org.github.io/iptv/countries/sv.m3u",
              "https://iptv-org.github.io/iptv/countries/gt.m3u",
              "https://iptv-org.github.io/iptv/countries/hn.m3u",
              "https://iptv-org.github.io/iptv/countries/mx.m3u",
              "https://iptv-org.github.io/iptv/countries/ni.m3u",
              "https://iptv-org.github.io/iptv/countries/pa.m3u",
              "https://iptv-org.github.io/iptv/countries/py.m3u",
              "https://iptv-org.github.io/iptv/countries/pe.m3u",
              "https://iptv-org.github.io/iptv/countries/pr.m3u",
              "https://iptv-org.github.io/iptv/countries/uy.m3u",
              "https://iptv-org.github.io/iptv/countries/ve.m3u",
          ]

          # Palabras para organizar canales
          ANIME = re.compile(
              r"anime|animax|otaku|manga|crunchyroll|anime station",
              re.I
          )

          KIDS = re.compile(
              r"kids|kid|niños|infantil|cartoon|dibujos|"
              r"nick|disney|toon|caricaturas",
              re.I
          )

          SPORTS = re.compile(
              r"sport|sports|deporte|deportes|futbol|fútbol|"
              r"soccer|espn|fox sports|tudn|gol|bein",
              re.I
          )

          MOVIES = re.compile(
              r"movie|movies|cine|cinema|pelicula|película|"
              r"film|films|hbo|cinemax",
              re.I
          )

          SERIES = re.compile(
              r"series|serie|novela|novelas|drama",
              re.I
          )

          MUSIC = re.compile(
              r"music|musica|música|mtv|radio|musical",
              re.I
          )

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 TV-Latino/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          groups = {
              "🎬 Películas": [],
              "📺 Series": [],
              "🐉 Anime": [],
              "🧒 Caricaturas / Infantil": [],
              "🎵 Música": [],
              "⚽ Deportes": [],
              "📡 TV General": [],
          }

          seen = set()

          for playlist in PLAYLISTS:

              try:
                  print("Descargando:", playlist)

                  data = download(playlist)

              except Exception as e:
                  print(
                      "No se pudo descargar:",
                      playlist,
                      e
                  )
                  continue

              lines = data.splitlines()

              i = 0

              while i < len(lines):

                  line = lines[i].strip()

                  if line.startswith("#EXTINF"):

                      if i + 1 >= len(lines):
                          break

                      url = lines[i + 1].strip()

                      if not url.startswith(
                          ("http://", "https://")
                      ):
                          i += 1
                          continue

                      if url in seen:
                          i += 2
                          continue

                      seen.add(url)

                      try:
                          name = line.split(
                              ",",
                              1
                          )[1].strip()

                      except Exception:
                          name = "Canal"

                      text = (
                          name + " " + line
                      ).lower()

                      if ANIME.search(text):

                          group = "🐉 Anime"

                      elif KIDS.search(text):

                          group = (
                              "🧒 Caricaturas / Infantil"
                          )

                      elif SPORTS.search(text):

                          group = "⚽ Deportes"

                      elif MOVIES.search(text):

                          group = "🎬 Películas"

                      elif SERIES.search(text):

                          group = "📺 Series"

                      elif MUSIC.search(text):

                          group = "🎵 Música"

                      else:

                          group = "📡 TV General"

                      # Cambiar o agregar group-title
                      if 'group-title="' in line:

                          line = re.sub(
                              r'group-title="[^"]*"',
                              f'group-title="{group}"',
                              line
                          )

                      else:

                          line = line.replace(
                              "#EXTINF:-1",
                              '#EXTINF:-1 '
                              f'group-title="{group}"'
                          )

                      groups[group].append(
                          (name.lower(), line, url)
                      )

                      i += 2

                  else:

                      i += 1

          ORDER = [
              "📡 TV General",
              "🎬 Películas",
              "📺 Series",
              "🐉 Anime",
              "🧒 Caricaturas / Infantil",
              "🎵 Música",
              "⚽ Deportes",
          ]

          output = ["#EXTM3U"]

          total = 0

          for group in ORDER:

              channels = sorted(
                  groups[group],
                  key=lambda x: x[0]
              )

              print(
                  group,
                  "=",
                  len(channels)
              )

              for _, info, url in channels:

                  output.append(info)
                  output.append(url)

                  total += 1

          with open(
              "TV_Latino.m3u",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:

              f.write(
                  "\n".join(output) + "\n"
              )

          print(
              "TV_Latino.m3u generado con",
              total,
              "canales."
          )

          if total == 0:
              raise RuntimeError(
                  "No se encontraron canales. "
                  "Se cancela la actualización."
              )

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TV_Latino.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios en la lista."
            exit 0
          fi

          git commit -m "Actualizar lista TV Latino"
          git push
